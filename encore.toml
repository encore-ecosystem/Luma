[project]
name = "luma"
version = "0.0.3"
description = "Cross-platform native UI toolkit"
repository = "https://github.com/encore-ecosystem/Luma"
encore = ">=0.1.6"
readme = "README.md"
licence = "MIT"
build = "build.enq"
dependencies = [
    "index@std@>=0.0.8",
    "workspace@color",
    "workspace@ui_native",
    "index@vulkan@>=0.1.1",
    "index@sdl@>=0.1.0",
    "index@gpu@>=0.1.1",
]

[features]
default = ["fonts"]
fonts = []

[publish]
include = ["encore.toml", "src/**", "workspace/ui_native/**", "workspace/color/**", "assets/**", "runtime.c", "build.enq", "LICENSE", "README.md"]
exclude = ["target/**", "**/target/**", "artifacts/**", "docs/book/**", "**/.encore_cache/**"]

[lint]
default = "warn"
dependencies = "allow"

[lint.rules]
# Encore's current mutability lint treats collection builders and retained
# tree patching as immutable even though their methods mutate through the
# receiver. Keep actionable lints enabled without flooding consumers.
unused-mut = "allow"
missing-public-docstring = "allow"
